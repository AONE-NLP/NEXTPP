pipeline_config_id: runner_config

data:
  earthquake:
    data_format: pkl
    train_dir: ./data/earthquake/train.pkl
    valid_dir: ./data/earthquake/dev.pkl
    test_dir: ./data/earthquake/test.pkl
    data_specs:
      num_event_types: 7
      pad_token_id: 7
      padding_side: right
      truncation_side: right

Earthquake:
  base_config:
    stage: train
    backend: torch
    dataset_id: earthquake
    runner_id: std_tpp
    model_id: NEXTPP 
    base_dir: './checkpoints/'
  trainer_config:
    batch_size: 256
    max_epoch: 150
    shuffle: False
    optimizer: adam
    learning_rate: 1.e-3
    valid_freq: 1
    use_tfb: False
    metrics: [ 'acc', 'rmse' ]
    seed: 2019
    gpu: 0
  model_config:
    hidden_size: 128
    time_emb_size: 16
    num_layers: 2
    num_heads: 4
    dropout_rate: 0.1
    chunk_ratio: 1.e-6 # When the chunk_ratio is sufficiently small, no chunking is applied.
    mc_num_sample_per_step: 20
    loss_integral_num_sample_per_step: 20
    use_ln: False
    thinning:
      num_seq: 10
      num_sample: 1
      num_exp: 500 # number of i.i.d. Exp(intensity_bound) draws at one time in thinning algorithm
      look_ahead_time: 10
      patience_counter: 5 # the maximum iteration used in adaptive thinning
      over_sample_rate: 5
      num_samples_boundary: 5
      dtime_max: 5
      num_step_gen: 1

